name: unit-pipeline

on:
  workflow_dispatch:
    inputs:
      unit_id:
        description: "ID de l'unité (ex: BUILD-000)"
        required: true
        type: string
      attempt:
        description: "Tentative (1-3)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

concurrency:
  group: build-pipeline
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.v.outputs.contract }}
      title: ${{ steps.v.outputs.title }}
      model: ${{ steps.v.outputs.model }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Valider unité, dépendances et tentative
        run: |
          node tools/queue.mjs validate "${{ inputs.unit_id }}" "${{ inputs.attempt }}" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Identité git du builder
        run: |
          git config user.name "builder-bot"
          git config user.email "actions@github.com"
      - name: Builder (Claude Code)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions"
          claude_args: '--model ${{ needs.guard.outputs.model }} --max-turns 120 --allowedTools "Bash,Read,Write,Edit,Glob,Grep"'
          prompt: |
            UNIT_ID: ${{ inputs.unit_id }}
            ATTEMPT: ${{ inputs.attempt }}
            TITRE: ${{ needs.guard.outputs.title }}
            CONTRAT: ${{ needs.guard.outputs.contract }}

            Lis dans cet ordre: CLAUDE.md, .build/protocol.md, .build/prompts/builder.md,
            puis le fichier CONTRAT ci-dessus. Exécute la mission décrite dans builder.md
            pour cette unité et cette tentative. Ne fais rien d'autre.

  gates:
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      result: ${{ steps.verdict.outputs.result }}
      pr: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unit/${{ inputs.unit_id }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Autofix mécanique (sans LLM)
        run: |
          npx eslint . --fix || true
          npx prettier -w . || true
          if ! git diff --quiet; then
            git config user.name "gates-bot"
            git config user.email "actions@github.com"
            git commit -am "chore: autofix (eslint --fix + prettier)"
            git push origin "unit/${{ inputs.unit_id }}"
          fi
      # Chaque gate loggue sa sortie complète (tee) et propage le code de npm via
      # PIPESTATUS[0] — sans lui, tee (exit 0) masquerait l'échec. shell: bash requis.
      - id: typecheck
        shell: bash
        run: |
          npm run typecheck 2>&1 | tee /tmp/gate-typecheck.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
      - id: lint
        shell: bash
        run: |
          npm run lint 2>&1 | tee /tmp/gate-lint.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
      - id: buildstep
        shell: bash
        run: |
          npm run build 2>&1 | tee /tmp/gate-buildstep.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
      - id: unit
        shell: bash
        run: |
          npm run test 2>&1 | tee /tmp/gate-unit.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Cache navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - id: e2e
        name: Screenshots Playwright
        shell: bash
        run: |
          npx playwright install --with-deps chromium 2>&1 | tee /tmp/gate-e2e.log
          npm run e2e 2>&1 | tee -a /tmp/gate-e2e.log
          exit ${PIPESTATUS[0]}
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ inputs.unit_id }}-a${{ inputs.attempt }}
          path: e2e/shots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-logs-${{ inputs.unit_id }}-a${{ inputs.attempt }}
          path: /tmp/gate-*.log
          if-no-files-found: ignore
      - id: pr
        name: Trouver la PR de l'unité
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list --head "unit/${{ inputs.unit_id }}" --json number --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
      - id: verdict
        name: Verdict gates (JSON signé + erreurs réelles) + commentaire PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # COMMIT = l'arbre réellement testé (après l'éventuel commit d'autofix), pas le ref demandé.
          COMMIT="$(git rev-parse HEAD)"
          AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > /tmp/gate-body.json << EOF
          {
            "unit": "${{ inputs.unit_id }}",
            "attempt": ${{ inputs.attempt }},
            "gates": {
              "typecheck": "${{ steps.typecheck.outcome }}",
              "lint": "${{ steps.lint.outcome }}",
              "build": "${{ steps.buildstep.outcome }}",
              "unit_tests": "${{ steps.unit.outcome }}",
              "e2e": "${{ steps.e2e.outcome }}"
            },
            "at": "$AT",
            "commit": "$COMMIT",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          declare -A OUT=(
            [typecheck]="${{ steps.typecheck.outcome }}"
            [lint]="${{ steps.lint.outcome }}"
            [buildstep]="${{ steps.buildstep.outcome }}"
            [unit]="${{ steps.unit.outcome }}"
            [e2e]="${{ steps.e2e.outcome }}"
          )
          r=pass
          FAILED=()
          for g in typecheck lint buildstep unit e2e; do
            if [ "${OUT[$g]}" = "failure" ]; then r=fail; FAILED+=("$g"); fi
          done
          # errors: extraits réels des logs de chaque gate en échec, ajoutés au corps AVANT le hash.
          # Le || est obligatoire: grep retourne 1 sans match et tuerait le step sous -e.
          # sed neutralise les backticks triples (sinon ils cassent les clôtures markdown du commentaire).
          # Assemblage UNIQUEMENT via jq --rawfile — jamais d'interpolation shell de contenu de log dans du JSON.
          for g in "${FAILED[@]}"; do
            if [ -f "/tmp/gate-$g.log" ]; then
              { grep -iE "error|fail|✘|cannot|expected" "/tmp/gate-$g.log" || tail -40 "/tmp/gate-$g.log"; } \
                | head -40 | head -c 3000 | sed 's/```/`` `/g' > "/tmp/err-$g.txt"
              jq --rawfile e "/tmp/err-$g.txt" --arg g "$g" '.errors[$g] = $e' /tmp/gate-body.json \
                > /tmp/gate-body.tmp && mv /tmp/gate-body.tmp /tmp/gate-body.json
            fi
          done
          # Le verdict lui-même fait partie du contenu haché.
          jq --arg r "$r" '. + {result: $r}' /tmp/gate-body.json > /tmp/gate-signed-body.json
          # hash = sha256 de la forme canonique (clés triées, compacte, sans saut de ligne final)
          # du verdict SANS le champ hash. Reproductible tel quel depuis le verdict publié:
          #   printf '%s' "$(jq -S -c 'del(.hash)' verdict.json)" | sha256sum
          CANON="$(jq -S -c . /tmp/gate-signed-body.json)"
          HASH="$(printf '%s' "$CANON" | sha256sum | cut -d' ' -f1)"
          jq -S --arg h "$HASH" '. + {hash: $h}' /tmp/gate-signed-body.json > /tmp/gate-report.json
          echo "result=$r" >> "$GITHUB_OUTPUT"
          if [ -n "${{ steps.pr.outputs.number }}" ]; then
            { echo "### GATES: $r (attempt ${{ inputs.attempt }})";
              echo '```json'; cat /tmp/gate-report.json; echo '```';
              for g in "${FAILED[@]}"; do
                if [ -f "/tmp/err-$g.txt" ]; then
                  echo; echo "#### Erreurs — $g"; echo '```text'; cat "/tmp/err-$g.txt"; echo; echo '```';
                fi
              done;
              echo "_hash = sha256 de \`jq -S -c\` du verdict privé de son champ \`hash\`. Logs bruts complets: artifact \`gate-logs-${{ inputs.unit_id }}-a${{ inputs.attempt }}\`._"; } \
              | gh pr comment "${{ steps.pr.outputs.number }}" --body-file -
          fi

  superviseur:
    needs: [guard, gates]
    # attempt est une STRING (input workflow_dispatch) — comparaison de strings obligatoire.
    if: always() && needs.gates.outputs.result == 'fail' && inputs.attempt == '2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unit/${{ inputs.unit_id }}
          fetch-depth: 0
      - name: Superviseur (Claude Code — lecture seule, plan de correction)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions"
          claude_args: '--model claude-opus-4-8 --max-turns 40 --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh api:*),Bash(gh pr comment:*),Bash(cat:*),Bash(ls:*),Bash(grep:*)"'
          prompt: |
            UNIT_ID: ${{ inputs.unit_id }}
            ATTEMPT: ${{ inputs.attempt }}
            PR: ${{ needs.gates.outputs.pr }}
            RUN_ID: ${{ github.run_id }}
            TITRE: ${{ needs.guard.outputs.title }}
            CONTRAT: ${{ needs.guard.outputs.contract }}

            Lis dans cet ordre: CLAUDE.md, .build/protocol.md, .build/prompts/superviseur.md,
            puis le fichier CONTRAT ci-dessus. Exécute la mission décrite dans superviseur.md
            pour cette unité et cette tentative. Ne fais rien d'autre.

  route:
    needs: [guard, gates, superviseur]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Router selon verdict
        run: |
          RESULT="${{ needs.gates.outputs.result }}"
          ATT=${{ inputs.attempt }}
          if [ "$RESULT" = "pass" ] && [ -n "${{ needs.gates.outputs.pr }}" ]; then
            gh workflow run review-pipeline.yml \
              -f unit_id="${{ inputs.unit_id }}" -f pr="${{ needs.gates.outputs.pr }}" -f attempt="$ATT"
          elif [ "$ATT" -lt 3 ]; then
            gh workflow run unit-pipeline.yml \
              -f unit_id="${{ inputs.unit_id }}" -f attempt="$((ATT+1))"
          else
            node tools/queue.mjs escalate "${{ inputs.unit_id }}" "$ATT" \
              "Gates en échec après $ATT tentatives" "${{ github.run_id }}"
          fi
